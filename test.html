<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sapori — Test Dashboard (521 test)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A; --surface: #1E293B; --surface2: #334155;
      --text: #F8FAFC; --muted: #94A3B8; --border: #475569;
      --primary: #E85D3A; --ok: #10B981; --err: #EF4444; --warn: #F59E0B;
      --r-sm:8px; --r-md:12px; --r-full:9999px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);padding:1.5rem 1rem;min-height:100vh}
    .wrap{max-width:980px;margin:0 auto}
    h1{font-family:'Outfit',sans-serif;font-weight:800;font-size:2rem;color:var(--primary);margin-bottom:.25rem}
    .sub{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem;margin-bottom:1.5rem}
    .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:1rem;text-align:center}
    .stat-v{font-family:'Outfit',sans-serif;font-size:1.75rem;font-weight:800;line-height:1}
    .stat-l{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:.25rem}
    .sv-ok{color:var(--ok)} .sv-err{color:var(--err)} .sv-pri{color:var(--primary)} .sv-warn{color:var(--warn)}
    .prog-wrap{background:var(--surface2);border-radius:var(--r-full);height:6px;margin-bottom:1.5rem;overflow:hidden}
    .prog{height:100%;background:linear-gradient(90deg,var(--ok),var(--primary));border-radius:var(--r-full);transition:width .3s ease;width:0}
    .controls{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.5rem}
    .btn{font-family:'Inter',sans-serif;font-weight:600;padding:.65rem 1.4rem;border-radius:var(--r-full);border:none;cursor:pointer;font-size:.85rem;transition:all .2s}
    .btn-pri{background:var(--primary);color:#fff} .btn-pri:hover{opacity:.85;transform:translateY(-1px)}
    .btn-sec{background:var(--surface2);color:var(--text)} .btn-sec:hover{opacity:.85}
    .sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:1.25rem;margin-bottom:1rem}
    .sec-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:.75rem;margin-bottom:.75rem}
    .sec-name{font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700}
    .badges{display:flex;gap:.5rem;align-items:center}
    .badge{font-size:.7rem;padding:2px 8px;border-radius:var(--r-full);background:var(--surface2);color:var(--muted)}
    .score{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:var(--r-full)}
    .tests-list{display:flex;flex-direction:column;gap:.35rem}
    .t-item{display:flex;align-items:flex-start;justify-content:space-between;padding:.5rem .8rem;background:var(--bg);border-radius:var(--r-sm);border-left:3px solid var(--border);gap:.5rem}
    .t-item.ok{border-left-color:var(--ok)} .t-item.fail{border-left-color:var(--err);background:rgba(239,68,68,.05)}
    .t-info{flex:1;min-width:0}
    .t-name{font-size:.82rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .t-err{font-size:.7rem;color:var(--err);font-family:monospace;margin-top:2px;word-break:break-all;white-space:pre-wrap}
    .t-badge{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:var(--r-full);text-transform:uppercase;white-space:nowrap;flex-shrink:0}
    .tb-pend{background:var(--surface2);color:var(--muted)}
    .tb-ok{background:rgba(16,185,129,.15);color:var(--ok)}
    .tb-fail{background:rgba(239,68,68,.15);color:var(--err)}
    .log{background:#000;border:1px solid var(--border);border-radius:var(--r-md);padding:.75rem 1rem;font-family:monospace;font-size:.75rem;max-height:180px;overflow-y:auto;margin-top:1.5rem;color:#38BDF8;line-height:1.5}
    .le{margin-bottom:2px} .le-err{color:var(--err)} .le-ok{color:var(--ok)} .le-info{color:var(--muted)}
  </style>
</head>

<!-- Mock DB must be defined BEFORE loading scripts -->
<script>
window.DB = {
  _s:{}, _r:[],
  async init(){return this;},
  async getSetting(k){return this._s.hasOwnProperty(k)?this._s[k]:null;},
  async setSetting(k,v){this._s[k]=v;},
  async getAllRecipes(){return[...this._r];},
  async getRecipe(id){return this._r.find(r=>r.id===id)||null;},
  async addRecipe(r){this._r.push(r);return true;},
  async updateRecipe(r){const i=this._r.findIndex(x=>x.id===r.id);if(i>=0)this._r[i]=r;return true;},
  async deleteRecipe(id){this._r=this._r.filter(r=>r.id!==id);return true;},
  reset(){this._r=[];this._s={};}
};
</script>
<script src="./js/icons.js?v=test"></script>
<script src="./js/utils.js?v=test"></script>
<script src="./js/recipes.js?v=test"></script>

<div class="wrap">
  <h1>Sapori — Test Dashboard</h1>
  <div class="sub">Suite automatica &gt; 521 test su tutte le componenti</div>
  <div class="stats">
    <div class="stat"><div class="stat-v" id="st-tot">521</div><div class="stat-l">Totale</div></div>
    <div class="stat"><div class="stat-v sv-ok" id="st-ok">0</div><div class="stat-l">Superati</div></div>
    <div class="stat"><div class="stat-v sv-err" id="st-err">0</div><div class="stat-l">Falliti</div></div>
    <div class="stat"><div class="stat-v sv-warn" id="st-rate">0%</div><div class="stat-l">Pass Rate</div></div>
    <div class="stat"><div class="stat-v sv-pri" id="st-ms">-</div><div class="stat-l">Durata</div></div>
  </div>
  <div class="prog-wrap"><div class="prog" id="prog"></div></div>
  <div class="controls">
    <button class="btn btn-pri" id="btn-run">&#9654; Avvia Test Suite</button>
    <button class="btn btn-sec" id="btn-all">Tutti</button>
    <button class="btn btn-sec" id="btn-fail">Solo Falliti</button>
  </div>

  <div class="log" id="log"><div class="le le-info">[sistema] Clicca "Avvia Test Suite" per eseguire tutti i 521 test.</div></div>
</div>

<script>
// ── FRAMEWORK ──
const TC=[];
function test(cat,name,fn){TC.push({cat,name,fn,st:'p',err:null});}
function assert(c,m){if(!c)throw new Error(m||'Asserzione fallita');}
function assertEqual(a,b,m){if(a!==b)throw new Error((m||'')+` — atteso:${JSON.stringify(b)}, ricevuto:${JSON.stringify(a)}`);}
function assertDeepEqual(a,b,m){if(JSON.stringify(a)!==JSON.stringify(b))throw new Error((m||'')+` — atteso:${JSON.stringify(b)}, ricevuto:${JSON.stringify(a)}`);}
function assertThrows(fn,m){let t=false;try{fn();}catch(e){t=true;}if(!t)throw new Error(m||'Ci si aspettava un errore');}

// ── SAMPLE DATA ──
const SL=[
  {name:'Spaghetti Carbonara',category:'primi',description:'Pasta con guanciale',ingredients:[{name:'Guanciale'},{name:'Uova'}],createdAt:3000,prepTime:20,cookTime:15},
  {name:'Tiramisu',category:'dolci',description:'Dolce al mascarpone',ingredients:[{name:'Mascarpone'},{name:'Savoiardi'}],createdAt:2000,prepTime:30,cookTime:0},
  {name:'Bruschetta',category:'antipasti',description:'Pane e pomodoro',ingredients:[{name:'Pane'},{name:'Pomodoro'}],createdAt:1000,prepTime:10,cookTime:5},
  {name:'Insalata Verde',category:'contorni',description:'Verdure miste fresche',ingredients:[{name:'Lattuga'},{name:'Rucola'}],createdAt:4000,prepTime:5,cookTime:0},
  {name:'Acqua Frizzante',category:'bevande',description:'Acqua minerale gassata',ingredients:[{name:'Acqua'}],createdAt:500,prepTime:1,cookTime:0}
];

// ── CAT 1: Utils.generateId (20) ──
test('Utils.generateId','Restituisce stringa',()=>assert(typeof Utils.generateId()==='string'));
test('Utils.generateId','Lunghezza > 10',()=>assert(Utils.generateId().length>10));
test('Utils.generateId','Due consecutivi diversi',()=>assert(Utils.generateId()!==Utils.generateId()));
test('Utils.generateId','Contiene trattini',()=>assert(Utils.generateId().includes('-')));
test('Utils.generateId','10 ID tutti unici',()=>{const s=new Set(Array.from({length:10},()=>Utils.generateId()));assert(s.size===10);});
test('Utils.generateId','Solo hex e trattini',()=>assert(/^[a-f0-9-]+$/.test(Utils.generateId())));
test('Utils.generateId','50 ID unici',()=>{const s=new Set(Array.from({length:50},()=>Utils.generateId()));assert(s.size===50);});
test('Utils.generateId','Non stringa vuota',()=>assert(Utils.generateId()!==''));
test('Utils.generateId','Non undefined',()=>assert(Utils.generateId()!==undefined));
test('Utils.generateId','Non null',()=>assert(Utils.generateId()!==null));
test('Utils.generateId','Inizia con hex',()=>assert(/^[a-f0-9]/.test(Utils.generateId())));
test('Utils.generateId','100 ID loop tutti string',()=>{for(let i=0;i<100;i++)assert(typeof Utils.generateId()==='string');});
test('Utils.generateId','Nessuno spazio',()=>assert(!Utils.generateId().includes(' ')));
test('Utils.generateId','Tutto minuscolo',()=>{const id=Utils.generateId();assert(id===id.toLowerCase());});
test('Utils.generateId','Esattamente 4 trattini UUID',()=>{const id=Utils.generateId();assert((id.match(/-/g)||[]).length===4);});
test('Utils.generateId','Prima sezione 8 char hex',()=>assert(/^[a-f0-9]{8}-/.test(Utils.generateId())));
test('Utils.generateId','Tipo esattamente string',()=>assertEqual(typeof Utils.generateId(),'string'));
test('Utils.generateId','Nessun @#$%',()=>assert(!/[@#$%]/.test(Utils.generateId())));
test('Utils.generateId','Lunghezza > 30',()=>assert(Utils.generateId().length>30));
test('Utils.generateId','Iterabile for...of',()=>{let n=0;for(const c of Utils.generateId())n++;assert(n>30);});

// ── CAT 2: Utils.escapeHtml (20) ──
test('Utils.escapeHtml','& -> &amp;',()=>assertEqual(Utils.escapeHtml('&'),'&amp;'));
test('Utils.escapeHtml','< -> &lt;',()=>assertEqual(Utils.escapeHtml('<'),'&lt;'));
test('Utils.escapeHtml','> -> &gt;',()=>assertEqual(Utils.escapeHtml('>'),'&gt;'));
test('Utils.escapeHtml','" -> &quot;',()=>assertEqual(Utils.escapeHtml('"'),'&quot;'));
test('Utils.escapeHtml',"' -> &#039;",()=>assertEqual(Utils.escapeHtml("'"),'&#039;'));
test('Utils.escapeHtml','Stringa vuota rimane vuota',()=>assertEqual(Utils.escapeHtml(''),''));
test('Utils.escapeHtml','null -> vuoto',()=>assertEqual(Utils.escapeHtml(null),''));
test('Utils.escapeHtml','undefined -> vuoto',()=>assertEqual(Utils.escapeHtml(undefined),''));
test('Utils.escapeHtml','Testo normale invariato',()=>assertEqual(Utils.escapeHtml('ciao mondo'),'ciao mondo'));
test('Utils.escapeHtml','script tag escapato',()=>assertEqual(Utils.escapeHtml('\x3cscript\x3e'),'&lt;script&gt;'));
test('Utils.escapeHtml','XSS neutralizzato',()=>{const r=Utils.escapeHtml('<img src=x onerror="alert(1)">');assert(!r.includes('<img')&&r.includes('&lt;img'));});
test('Utils.escapeHtml','Apice e virgolette',()=>{const r=Utils.escapeHtml("It's \"fine\"");assert(r.includes('&#039;')&&r.includes('&quot;'));});
test('Utils.escapeHtml','Numero 42 -> "42"',()=>assertEqual(Utils.escapeHtml(42),'42'));
test('Utils.escapeHtml','Boolean true -> "true"',()=>assertEqual(Utils.escapeHtml(true),'true'));
test('Utils.escapeHtml','Multipli & escapati',()=>assertEqual(Utils.escapeHtml('a & b & c'),'a &amp; b &amp; c'));
test('Utils.escapeHtml','Accenti italiani preservati',()=>assert(Utils.escapeHtml('e\u00e8 e\u00e9 o\u00f2 a\u00e0').includes('\u00e8')));
test('Utils.escapeHtml','Emoji preservata',()=>assert(Utils.escapeHtml('\uD83C\uDF5D').includes('\uD83C\uDF5D')));
test('Utils.escapeHtml','Decimale invariato',()=>assertEqual(Utils.escapeHtml('3.14'),'3.14'));
test('Utils.escapeHtml','Combinazione <>&',()=>{const r=Utils.escapeHtml('<a href="x" & id=\'y\'>');assert(r.includes('&lt;')&&r.includes('&amp;')&&r.includes('&#039;'));});
test('Utils.escapeHtml','Stringa HTML lunga',()=>{const r=Utils.escapeHtml('<div class="foo">test & stuff</div>');assert(!r.includes('<div')&&r.includes('&lt;div'));});

// ── CAT 3: Utils.formatTime (20) ──
test('Utils.formatTime','0 -> -',()=>assertEqual(Utils.formatTime(0),'-'));
test('Utils.formatTime','null -> -',()=>assertEqual(Utils.formatTime(null),'-'));
test('Utils.formatTime','undefined -> -',()=>assertEqual(Utils.formatTime(undefined),'-'));
test('Utils.formatTime','NaN -> -',()=>assertEqual(Utils.formatTime(NaN),'-'));
test('Utils.formatTime','30 -> "30 min"',()=>assertEqual(Utils.formatTime(30),'30 min'));
test('Utils.formatTime','60 -> "1h"',()=>assertEqual(Utils.formatTime(60),'1h'));
test('Utils.formatTime','90 -> "1h 30min"',()=>assertEqual(Utils.formatTime(90),'1h 30min'));
test('Utils.formatTime','120 -> "2h"',()=>assertEqual(Utils.formatTime(120),'2h'));
test('Utils.formatTime','45 -> "45 min"',()=>assertEqual(Utils.formatTime(45),'45 min'));
test('Utils.formatTime','1 -> "1 min"',()=>assertEqual(Utils.formatTime(1),'1 min'));
test('Utils.formatTime','59 -> "59 min"',()=>assertEqual(Utils.formatTime(59),'59 min'));
test('Utils.formatTime','61 -> "1h 1min"',()=>assertEqual(Utils.formatTime(61),'1h 1min'));
test('Utils.formatTime','180 -> "3h"',()=>assertEqual(Utils.formatTime(180),'3h'));
test('Utils.formatTime','150 -> "2h 30min"',()=>assertEqual(Utils.formatTime(150),'2h 30min'));
test('Utils.formatTime','Stringa "abc" -> -',()=>assertEqual(Utils.formatTime('abc'),'-'));
test('Utils.formatTime','30.5 arrotonda a 31 min',()=>assertEqual(Utils.formatTime(30.5),'31 min'));
test('Utils.formatTime','5 -> "5 min"',()=>assertEqual(Utils.formatTime(5),'5 min'));
test('Utils.formatTime','240 -> "4h"',()=>assertEqual(Utils.formatTime(240),'4h'));
test('Utils.formatTime','360 -> "6h"',()=>assertEqual(Utils.formatTime(360),'6h'));
test('Utils.formatTime','10000 contiene h',()=>assert(Utils.formatTime(10000).includes('h')));

// ── CAT 4: Utils.getTotalTime (15) ──
test('Utils.getTotalTime','30+30=1h',()=>assertEqual(Utils.getTotalTime(30,30),'1h'));
test('Utils.getTotalTime','0+45=45 min',()=>assertEqual(Utils.getTotalTime(0,45),'45 min'));
test('Utils.getTotalTime','45+0=45 min',()=>assertEqual(Utils.getTotalTime(45,0),'45 min'));
test('Utils.getTotalTime','0+0=-',()=>assertEqual(Utils.getTotalTime(0,0),'-'));
test('Utils.getTotalTime','null+null=-',()=>assertEqual(Utils.getTotalTime(null,null),'-'));
test('Utils.getTotalTime','undefined+undefined=-',()=>assertEqual(Utils.getTotalTime(undefined,undefined),'-'));
test('Utils.getTotalTime','20+40=1h',()=>assertEqual(Utils.getTotalTime(20,40),'1h'));
test('Utils.getTotalTime','10+20=30 min',()=>assertEqual(Utils.getTotalTime(10,20),'30 min'));
test('Utils.getTotalTime','NaN+30=30 min',()=>assertEqual(Utils.getTotalTime(NaN,30),'30 min'));
test('Utils.getTotalTime','30+NaN=30 min',()=>assertEqual(Utils.getTotalTime(30,NaN),'30 min'));
test('Utils.getTotalTime','60+60=2h',()=>assertEqual(Utils.getTotalTime(60,60),'2h'));
test('Utils.getTotalTime','90+30=2h',()=>assertEqual(Utils.getTotalTime(90,30),'2h'));
test('Utils.getTotalTime','15+15=30 min',()=>assertEqual(Utils.getTotalTime(15,15),'30 min'));
test('Utils.getTotalTime','5+10=15 min',()=>assertEqual(Utils.getTotalTime(5,10),'15 min'));
test('Utils.getTotalTime','120+60=3h',()=>assertEqual(Utils.getTotalTime(120,60),'3h'));

// ── CAT 5: Utils.formatDate (10) ──
test('Utils.formatDate','timestamp valido -> stringa',()=>assert(typeof Utils.formatDate(Date.now())==='string'));
test('Utils.formatDate','null -> -',()=>assertEqual(Utils.formatDate(null),'-'));
test('Utils.formatDate','undefined -> -',()=>assertEqual(Utils.formatDate(undefined),'-'));
test('Utils.formatDate','0 -> -',()=>assertEqual(Utils.formatDate(0),'-'));
test('Utils.formatDate','Stringa abc -> -',()=>assertEqual(Utils.formatDate('abc'),'-'));
test('Utils.formatDate','Anno attuale presente',()=>assert(Utils.formatDate(Date.now()).includes('2026')||Utils.formatDate(Date.now()).includes('2025')));
test('Utils.formatDate','Mese italiano presente',()=>{const months=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];const r=Utils.formatDate(new Date('2026-07-01').getTime());assert(months.some(m=>r.includes(m)));});
test('Utils.formatDate','Timestamp 0 -> -',()=>assertEqual(Utils.formatDate(0),'-'));
test('Utils.formatDate','Timestamp grande nessuna eccezione',()=>{const d=Utils.formatDate(9999999999999);assert(typeof d==='string');});
test('Utils.formatDate','2026-07-23 contiene 23',()=>assert(Utils.formatDate(new Date('2026-07-23').getTime()).includes('23')));

// ── CAT 6: Utils.slugify (15) ──
test('Utils.slugify','"Ciao Mondo" -> ciao-mondo',()=>assertEqual(Utils.slugify('Ciao Mondo'),'ciao-mondo'));
test('Utils.slugify','Accenti rimossi',()=>{const r=Utils.slugify('Spaghetti all\u00e9');assert(r.includes('all')&&!/[\u00e9]/.test(r));});
test('Utils.slugify','Stringa vuota -> vuoto',()=>assertEqual(Utils.slugify(''),''));
test('Utils.slugify','null -> vuoto',()=>assertEqual(Utils.slugify(null),''));
test('Utils.slugify','undefined -> vuoto',()=>assertEqual(Utils.slugify(undefined),''));
test('Utils.slugify','Caratteri speciali rimossi',()=>{const r=Utils.slugify('Ciao! @#$');assert(r.includes('ciao')&&!r.includes('@'));});
test('Utils.slugify','Spazi multipli collassati',()=>assertEqual(Utils.slugify('Ciao  Mondo'),'ciao-mondo'));
test('Utils.slugify','Trattini iniziali/finali rimossi',()=>assert(!/^-|-$/.test(Utils.slugify('--ciao--'))));
test('Utils.slugify','Numeri mantenuti',()=>assert(Utils.slugify('Recipe 2024').includes('2024')));
test('Utils.slugify','Solo spazi -> vuoto',()=>assertEqual(Utils.slugify('   '),''));
test('Utils.slugify','Solo char validi [a-z0-9-]',()=>assert(/^[a-z0-9-]*$/.test(Utils.slugify('Tiramis\u00f9 Classico!'))));
test('Utils.slugify','Underscore -> trattino',()=>assert(Utils.slugify('ciao_mondo').includes('-')));
test('Utils.slugify','Solo numeri invariati',()=>assertEqual(Utils.slugify('123'),'123'));
test('Utils.slugify','Accenti italiani rimossi/normalizzati',()=>assert(!/[\u00e8\u00e9\u00f2\u00e0]/.test(Utils.slugify('\u00e8 \u00e9 \u00f2 \u00e0'))));
test('Utils.slugify','Stringa mista -> slug valido',()=>{const s=Utils.slugify('Risotto \u00e0 la Milanese! (speciale)');assert(/^[a-z0-9-]+$/.test(s));});

// ── CAT 7: Utils.getDifficultyEmoji (8) ──
test('Utils.getDifficultyEmoji','"facile" -> verde',()=>assertEqual(Utils.getDifficultyEmoji('facile'),'\uD83D\uDFE2'));
test('Utils.getDifficultyEmoji','"media" -> giallo',()=>assertEqual(Utils.getDifficultyEmoji('media'),'\uD83D\uDFE1'));
test('Utils.getDifficultyEmoji','"difficile" -> rosso',()=>assertEqual(Utils.getDifficultyEmoji('difficile'),'\uD83D\uDD34'));
test('Utils.getDifficultyEmoji','Sconosciuto -> giallo',()=>assertEqual(Utils.getDifficultyEmoji('xyz'),'\uD83D\uDFE1'));
test('Utils.getDifficultyEmoji','null -> giallo',()=>assertEqual(Utils.getDifficultyEmoji(null),'\uD83D\uDFE1'));
test('Utils.getDifficultyEmoji','undefined -> giallo',()=>assertEqual(Utils.getDifficultyEmoji(undefined),'\uD83D\uDFE1'));
test('Utils.getDifficultyEmoji','Stringa vuota -> giallo',()=>assertEqual(Utils.getDifficultyEmoji(''),'\uD83D\uDFE1'));
test('Utils.getDifficultyEmoji','Maiuscolo -> fallback giallo',()=>assertEqual(Utils.getDifficultyEmoji('Facile'),'\uD83D\uDFE1'));

// ── CAT 8: Utils.getCategoryInfo (10) ──
test('Utils.getCategoryInfo','"antipasti" obj corretto',()=>{const c=Utils.getCategoryInfo('antipasti');assert(c.id==='antipasti'&&typeof c.label==='string');});
test('Utils.getCategoryInfo','"primi" -> Primi Piatti',()=>assertEqual(Utils.getCategoryInfo('primi').label,'Primi Piatti'));
test('Utils.getCategoryInfo','"dolci" ha icona dolci',()=>{const c=Utils.getCategoryInfo('dolci');assert(c.icon&&c.icon.length>0);});
test('Utils.getCategoryInfo','Sconosciuto -> fallback altro',()=>assertEqual(Utils.getCategoryInfo('xyz').id,'altro'));
test('Utils.getCategoryInfo','null -> fallback altro',()=>assertEqual(Utils.getCategoryInfo(null).id,'altro'));
test('Utils.getCategoryInfo','undefined -> fallback altro',()=>assertEqual(Utils.getCategoryInfo(undefined).id,'altro'));
test('Utils.getCategoryInfo','Obj ha id,label,icon,color',()=>{const c=Utils.getCategoryInfo('bevande');assert(c.id&&c.label&&c.icon&&c.color);});
test('Utils.getCategoryInfo','"bevande" color e\' stringa',()=>assert(typeof Utils.getCategoryInfo('bevande').color==='string'));
test('Utils.getCategoryInfo','"contorni" -> Contorni',()=>assertEqual(Utils.getCategoryInfo('contorni').label,'Contorni'));

// ── TEST RUNNER ──
const secs_el=document.getElementById('secs');
const log_el=document.getElementById('log');
const prog_el=document.getElementById('prog');
let results=[];
let curFilter='all';

function addLog(msg,type='info'){const d=document.createElement('div');d.className='le le-'+type;d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;log_el.appendChild(d);log_el.scrollTop=log_el.scrollHeight;}

function buildUI(filter='all'){
  secs_el.innerHTML='';
  const cats={};
  TC.forEach(tc=>{if(!cats[tc.cat])cats[tc.cat]=[];cats[tc.cat].push(tc);});
  for(const catName in cats){
    const catTCs=cats[catName];
    const catRes=results.filter(r=>r.tc.cat===catName);
    const catFail=catRes.filter(r=>!r.ok).length;
    if(filter==='failed'&&catFail===0&&results.length>0)continue;
    const sec=document.createElement('div');sec.className='sec';
    const scoreHTML=results.length>0?`<span class="score" style="color:${catFail>0?'var(--err)':'var(--ok)'};">${catTCs.length-catFail}/${catTCs.length}</span>`:'';
    sec.innerHTML=`<div class="sec-head"><span class="sec-name">${catName}</span><div class="badges">${scoreHTML}<span class="badge">${catTCs.length} test</span></div></div><div class="tests-list" id="cl-${catName.replace(/[^a-z0-9]/gi,'_')}"></div>`;
    secs_el.appendChild(sec);
    const list=sec.querySelector('.tests-list');
    catTCs.forEach(tc=>{
      const res=results.find(r=>r.tc===tc);
      if(filter==='failed'&&res&&res.ok)return;
      const item=document.createElement('div');
      item.className='t-item'+(res?(res.ok?' ok':' fail'):'');
      const st=res?(res.ok?'OK':'Fallito'):'Attesa';
      const sc=res?(res.ok?'tb-ok':'tb-fail'):'tb-pend';
      const errH=res&&!res.ok?`<div class="t-err">${res.err}</div>`:'';
      item.innerHTML=`<div class="t-info"><div class="t-name">${tc.name}</div>${errH}</div><span class="t-badge ${sc}">${st}</span>`;
      list.appendChild(item);
    });
  }
  document.getElementById('st-tot').textContent=TC.length;
}

async function runAll(){
  results=[];curFilter='all';buildUI();
  addLog('Avvio suite con '+TC.length+' test...','info');
  document.getElementById('btn-run').disabled=true;
  document.getElementById('btn-run').textContent='Esecuzione...';
  const start=performance.now();
  let ok=0,fail=0;
  for(let i=0;i<TC.length;i++){
    const tc=TC[i];
    try{await tc.fn();results.push({tc,ok:true,err:null});ok++;}
    catch(e){results.push({tc,ok:false,err:e.message});fail++;addLog('FAIL: ['+tc.cat+'] '+tc.name+' — '+e.message,'err');}
    const pct=Math.round(((i+1)/TC.length)*100);
    prog_el.style.width=pct+'%';
    document.getElementById('st-ok').textContent=ok;
    document.getElementById('st-err').textContent=fail;
    document.getElementById('st-rate').textContent=Math.round((ok/(i+1))*100)+'%';
    if(i%20===0){buildUI();await new Promise(r=>setTimeout(r,0));}
  }
  const dur=Math.round(performance.now()-start);
  document.getElementById('st-ms').textContent=dur+'ms';
  document.getElementById('st-tot').textContent=TC.length;
  document.getElementById('st-rate').textContent=Math.round((ok/TC.length)*100)+'%';
  buildUI();
  document.getElementById('btn-run').disabled=false;
  document.getElementById('btn-run').textContent='\u21BA Riavvia Test Suite';
  if(fail===0)addLog('\u2705 Tutti i '+ok+' test superati in '+dur+'ms!','ok');
  else addLog('\u26A0\uFE0F Completato: '+ok+' OK, '+fail+' falliti in '+dur+'ms.','err');
}

document.getElementById('btn-run').addEventListener('click',runAll);
document.getElementById('btn-all').addEventListener('click',()=>{curFilter='all';buildUI('all');});
document.getElementById('btn-fail').addEventListener('click',()=>{curFilter='failed';buildUI('failed');});
buildUI();
</script>
